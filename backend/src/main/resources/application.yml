    mode: ${AI_TRADING_RISK_MODE:AUTO}
    # 风控模式描述
    mode-description: "风险控制模式，AUTO为自动模式，MANUAL为手动模式"
    # 交易风格: C1保守型(3%/5%), C2谨慎型(5%/10%), C3稳健型(8%/15%), C4积极型(12%/20%), C5激进型(18%/30%)
    trading-style: ${AI_TRADING_TRADING_STYLE:C3_MODERATE}
    # 交易风格描述
    trading-style-description: "交易风格：C1保守型(3%/5%), C2谨慎型(5%/10%), C3稳健型(8%/15%), C4积极型(12%/20%), C5激进型(18%/30%)"
    # 自动作业开关: true启用, false禁用
    automatic-trade-enabled: ${AI_TRADING_AUTOMATIC_TRADE_ENABLED:true}
    # 思考模式开关: true启用, false禁用
    thinking-mode-enabled: ${AI_TRADING_THINKING_MODE_ENABLED:true}

# Encryption Configuration
encryption:
  secret-key: "0123456789abcdef0123456789abcdef" # 32 characters for AES-256
  salt: "1234567890abcdef" # 16 characters for AES

# AI Trading Execution Configuration
ai:
  trading:
    # 自动交易执行开关（默认开启）
    auto-execution: ${AI_TRADING_AUTO_EXECUTION:true}

    # 执行模式: dry-run(模拟) / live(实盘)
    execution-mode: ${AI_TRADING_EXECUTION_MODE:live}

    # 最低置信度要求（0-100）
    min-confidence: ${AI_TRADING_MIN_CONFIDENCE:60}

    # 单次最大交易金额比例（0-1之间，例如0.1表示10%）
    max-amount-ratio: ${AI_TRADING_MAX_AMOUNT_RATIO:0.25}

    # 最小交易金额（USDT）
    min-amount: ${AI_TRADING_MIN_AMOUNT:10.0}

    # 最大交易金额（USDT）
    max-amount: ${AI_TRADING_MAX_AMOUNT:50.0}

    # 账户最大可用金额限制（USDT）
    # 用于限制AI交易时的账户总权益，避免AI误以为有大量资金可用
    max-account-balance: ${AI_TRADING_MAX_ACCOUNT_BALANCE:200.0}

    # 默认杠杆倍数
    default-leverage: ${AI_TRADING_DEFAULT_LEVERAGE:3}

    # 是否启用风控检查
    enable-risk-control: ${AI_TRADING_ENABLE_RISK_CONTROL:true}


# 技术指标配置
technical:
  indicator:
    # 技术指标小数精度，默认8位
    decimal-scale: ${TECHNICAL_INDICATOR_DECIMAL_SCALE:8} 
