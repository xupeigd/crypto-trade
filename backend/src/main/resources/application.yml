spring:
  application:
    name: crypto-trade-backend

  # Allow circular references for development
  main:
    allow-circular-references: true

  # MySQL Configuration
  datasource:
    url: jdbc:mysql://${CRYPTO_TRADE_URL}/${CRYPTO_TRADE_DB}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${CRYPTO_TRADE_USERNAME}
    password: ${CRYPTO_TRADE_PASSWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # MySQL specific configurations
      auto-commit: false  # 改为false，让JPA管理事务
      connection-timeout: 30000
      maximum-pool-size: 50     # 增大连接池,避免连接池耗尽(原20)
      minimum-idle: 5           # 增加最小空闲连接(原5)
      idle-timeout: 600000
      max-lifetime: 1800000
      # Connection testing for MySQL
      connection-test-query: SELECT 1
      validation-timeout: 3000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # Lower logging level to see SQL statements
        highlight_sql: true
        # MySQL specific configuration
        jdbc:
          batch_size: 20
          time_zone: Asia/Shanghai
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        # Enable transaction management
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
        allow_refresh_detached_entity: true
    open-in-view: false


      # Spring AI Configuration
      #  ai:
      #    ollama:
      #      base-url: http://localhost:11434
      #      chat:
      #        client:
    #        connect-timeout: 60s    # 连接超时60秒
    #        read-timeout: 300s      # 读取超时5分钟（AI响应可能较慢）
    # 不配置默认模型，由DynamicModelFactory动态管理
    # options:
    #   model: # 不设置，使用动态模型切换
    #   temperature: 0.7
    #   max-tokens: 4000

  # Jackson Configuration
  jackson:
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  # Cache Configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

  # Task Configuration
  task:
    thread-pool:
      core-size: 10
      max-size: 20
      queue-capacity: 100
      keep-alive-seconds: 60

# Server Configuration
server:
  port: 8080
  # context-path已移除,统一使用根路径访问

# Logging Configuration
logging:
  level:
    com.crypto.trade: INFO
    org.springframework.web: WARN
    org.springframework.orm.jpa: WARN
    org.springframework.jdbc: WARN
    org.springframework.orm.jpa.JpaTransactionManager: WARN
    org.springframework.jdbc.datasource.DataSourceUtils: WARN
    org.springframework.orm.jpa.SharedEntityManagerCreator: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n"

# CEX API Configuration
cex:
  api:
    timeout: 30000
    retry:
      max-attempts: 3
      backoff-delay: 1000
    # 限流配置
    rate-limit:
      # 每个API Key的QPS限制（默认10）
      per-api-key-qps: ${CEX_API_PER_KEY_QPS:10}
      # 全局QPS限制（默认20）
      global-qps: ${CEX_API_GLOBAL_QPS:15}
      # 限流等待超时时间（毫秒，修复假死bug：从800ms降低到50ms）
      wait-timeout-ms: ${CEX_API_WAIT_TIMEOUT_MS:50}

# Top30 API Configuration
top30:
  # 基础配置
  cache-ttl-minutes: 5
  default-vendor: "OKX"
  default-inst-type: "SWAP"
  default-limit: 30

  # 异步更新配置
  async-update-enabled: true
  update-interval-seconds: 60
  precompute-hours: 24

  # 缓存配置
  cache-enabled: true
  fallback-enabled: true

